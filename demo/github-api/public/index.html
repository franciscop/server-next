<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in with GitHub (SPA)</title>
  </head>
  <body>
    <h1>Sign in with GitHub</h1>
    <p><button id="login">Sign in</button></p>
    <pre id="out">Not signed in.</pre>

    <script type="module">
      const out = document.querySelector("#out");

      // Coming back from the login: the token rides in the fragment, which
      // browsers never send to a server. Take it and clean the URL.
      const fragment = new URLSearchParams(location.hash.slice(1));
      if (fragment.get("token")) {
        localStorage.token = fragment.get("token");
        history.replaceState(null, "", location.pathname);
      }

      // Already signed in? The token is ours to keep and send.
      const token = localStorage.token;
      if (token) {
        const res = await fetch("/api/me", {
          headers: { authorization: `Bearer ${token}` },
        });
        out.textContent = res.ok
          ? JSON.stringify(await res.json(), null, 2)
          : "Token rejected, sign in again.";
      }

      // Ask the server where to send the visitor; it mounts no redirect of
      // its own under a client-held credential
      document.querySelector("#login").onclick = async () => {
        const res = await fetch("/auth/login/github", {
          headers: { accept: "application/json" },
        });
        const { url } = await res.json();
        location.href = url;
      };
    </script>
  </body>
</html>
