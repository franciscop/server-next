name: tests

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm install
      - name: Install the Better Auth demo dependencies
        run: npm install --prefix demo/auth-better-auth
      - name: Run the linter
        run: npm run lint
      - name: Run the tests
        run: npm test
        env:
          CI: true
